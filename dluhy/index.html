<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generátor oddílových dluhů - ORIS</title>
    <!-- Využití Bootstrapu pro rychlý a moderní vzhled -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Export oddílových dluhů ze závodů</h1>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <form id="debtForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="clubSelect" class="form-label">Výběr klubu</label>
                            <select class="form-select" id="clubSelect" required>
                                <option value="" disabled selected>Načítám kluby z ORISu...</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="dateFrom" class="form-label">Datum od</label>
                            <input type="date" class="form-control" id="dateFrom" required>
                        </div>
                        <div class="col-md-3">
                            <label for="dateTo" class="form-label">Datum do</label>
                            <input type="date" class="form-control" id="dateTo" required>
                        </div>
                    </div>

                    <hr>
                    
                    <h5 class="mb-3">1. Druhy závodů (plné startovné)</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <strong>Oficiální závody (defaultně VYPNUTO)</strong>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="MCR" id="MCR"><label class="form-check-label" for="MCR">MČR</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="CP" id="CP"><label class="form-check-label" for="CP">ČP</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="ZA" id="ZA"><label class="form-check-label" for="ZA">ŽA</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="ZB" id="ZB"><label class="form-check-label" for="ZB">ŽB</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="CPS" id="CPS"><label class="form-check-label" for="CPS">ČPŠ</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="OZ" id="OZ"><label class="form-check-label" for="OZ">OŽ</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="OM" id="OM"><label class="form-check-label" for="OM">OM</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="VET" id="VET"><label class="form-check-label" for="VET">VET</label></div>
                        </div>
                        <div class="col-md-6">
                            <strong>Ostatní závody (defaultně ZAPNUTO)</strong>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="OST" id="OST" checked><label class="form-check-label" for="OST">OST</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="ZL" id="ZL" checked><label class="form-check-label" for="ZL">ZL</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="OF" id="OF" checked><label class="form-check-label" for="OF">OF</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="SEM" id="SEM" checked><label class="form-check-label" for="SEM">SEM</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="ET" id="ET" checked><label class="form-check-label" for="ET">ET</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="E" id="E" checked><label class="form-check-label" for="E">E</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="REG" id="REG" checked><label class="form-check-label" for="REG">REG</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="STK" id="STK" checked><label class="form-check-label" for="STK">STK</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="PS" id="PS" checked><label class="form-check-label" for="PS">PS</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="TC" id="TC" checked><label class="form-check-label" for="TC">TC</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="REPRE" id="REPRE" checked><label class="form-check-label" for="REPRE">REPRE</label></div>
                        </div>
                    </div>

                    <hr>

                    <h5 class="mb-3">2. Doplňkové služby</h5>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="servicesRule" id="servicesSelected" value="selected">
                        <label class="form-check-label" for="servicesSelected">Počítat pouze na vybraných závodech (dle bodu 1)</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="servicesRule" id="servicesAll" value="all" checked>
                        <label class="form-check-label" for="servicesAll">Počítat na VŠECH závodech</label>
                    </div>

                    <h5 class="mb-3">3. Navýšení startovného</h5>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="lateFeeRule" checked>
                        <label class="form-check-label" for="lateFeeRule">Počítat navýšení i na NEVYBRANÝCH závodech (z bodu 1)</label>
                    </div>

                    <h5 class="mb-3">4. Absence (propadlé startovné)</h5>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="absenceRule" checked>
                        <label class="form-check-label" for="absenceRule">Počítat absenci i na NEVYBRANÝCH závodech (z bodu 1)</label>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100" id="submitBtn">
                        Vygenerovat a stáhnout Excel
                    </button>
                    <div id="loadingMsg" class="text-center text-primary mt-3" style="display: none;">
                        <strong>Zpracovávám data, to může chvíli trvat...</strong>
                    </div>
                </form>
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
<script src="app.js"></script>
</body>
</html>
